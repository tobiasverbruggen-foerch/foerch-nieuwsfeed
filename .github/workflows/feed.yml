name: Nieuwsfeed foerch.be

on:
  schedule:
    - cron: "15 5,9,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python maak_feed.py
      - name: Wijzigingen bewaren
        run: |
          git config user.name "nieuwsfeed-bot"
          git config user.email "nieuwsfeed-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet -- docs/gezien.json; then
            echo "Geen nieuwe artikels."
          else
            git commit -m "Nieuwe artikels op foerch.be"
            git push
          fi
